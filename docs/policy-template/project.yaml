# 내 프로젝트 설정 — knowledge/project-policies/<project_id>/project.yaml 로 복사해서 쓴다.
# project_id는 폴더 이름과 같아야 한다 (영문 소문자, 숫자, 하이픈 권장).
project_id: my-project
name: My Project
target_level: AA            # A | AA | AAA

# 디자인 시스템 컴포넌트 → 실제로 렌더링하는 네이티브 요소.
# jsx-a11y가 <Button>을 <button>처럼 검사하게 해 준다. 없으면 비워 둔다: component_mapping: {}
component_mapping:
  Button: button
  Link: a
