id: combobox-03-clean
component: combobox
category: negative
kind: clean
code_type: jsx
request: 자동완성 컴포넌트 접근성 점검해 줘.
code: |
  import { useState } from "react";

  export function FruitCombobox({ options, onPick }) {
    const [query, setQuery] = useState("");
    const [open, setOpen] = useState(false);
    const [index, setIndex] = useState(-1);
    const matches = options.filter((o) => o.includes(query));

    const choose = (value) => {
      setQuery(value);
      setOpen(false);
      setIndex(-1);
      onPick(value);
    };

    const onKeyDown = (e) => {
      if (e.key === "ArrowDown") {
        e.preventDefault();
        setOpen(true);
        setIndex((i) => Math.min(i + 1, matches.length - 1));
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        setIndex((i) => Math.max(i - 1, 0));
      } else if (e.key === "Enter" && open && index >= 0) {
        e.preventDefault();
        choose(matches[index]);
      } else if (e.key === "Escape") {
        setOpen(false);
        setIndex(-1);
      }
    };

    return (
      <div>
        <label htmlFor="fruit">과일</label>
        <input
          id="fruit"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded={open}
          aria-controls="fruit-list"
          aria-activedescendant={open && index >= 0 ? `fruit-${index}` : undefined}
          value={query}
          onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
          onKeyDown={onKeyDown}
        />
        <ul id="fruit-list" role="listbox" aria-label="과일 추천" hidden={!open}>
          {matches.map((o, i) => (
            <li
              key={o}
              id={`fruit-${i}`}
              role="option"
              aria-selected={i === index}
              onMouseDown={(e) => { e.preventDefault(); choose(o); }}
            >
              {o}
            </li>
          ))}
        </ul>
      </div>
    );
  }
expected:
  outcomes: [no_issue_detected, no_change_needed]
