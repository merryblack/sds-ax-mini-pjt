id: tabs-01-div-tabs
component: tabs
category: positive
kind: issue
code_type: jsx
request: 설정 화면 탭 접근성 검토해 줘.
code: |
  export function SettingsTabs({ active, onChange }) {
    return (
      <div className="tabs">
        <div className={active === "profile" ? "tab active" : "tab"} onClick={() => onChange("profile")}>프로필</div>
        <div className={active === "security" ? "tab active" : "tab"} onClick={() => onChange("security")}>보안</div>
      </div>
    );
  }
