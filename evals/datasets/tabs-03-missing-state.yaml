id: tabs-03-missing-state
component: tabs
category: positive
kind: issue
code_type: jsx
request: 탭 컴포넌트 ARIA 검토해 줘.
code: |
  import { useState } from "react";

  export function HelpTabs({ sections }) {
    const [active, setActive] = useState(0);
    return (
      <div>
        <div role="tablist" aria-label="도움말">
          {sections.map((s, i) => (
            <button key={s.id} type="button" role="tab" onClick={() => setActive(i)}>
              {s.title}
            </button>
          ))}
        </div>
        <div className="panel">{sections[active].body}</div>
      </div>
    );
  }
expected:
  outcomes: [improved]
  findings:
    - description: 탭에 aria-selected가 없어 어느 탭이 선택되었는지 보조기술에 전달되지 않는다.
      status: suspected
      fix_scope: local
      wcag_criteria: ["4.1.2"]
    - description: 패널에 role="tabpanel"이 없고 탭과 패널이 aria-controls·aria-labelledby로 연결되어 있지 않다.
      status: suspected
      fix_scope: local
      wcag_criteria: ["1.3.1", "4.1.2"]
  document_ids: [wcag-4.1.2, apg-tabs-roles]
