id: dialog-01-div-modal-no-role
component: dialog
category: issue
code_type: jsx
request: 확인 모달 접근성 검토해 줘.
code: |
  export function ConfirmDialog({ open, title, onClose, onConfirm }) {
    if (!open) return null;
    return (
      <div className="overlay">
        <div className="dialog">
          <h2>{title}</h2>
          <p>정말 삭제하시겠습니까?</p>
          <button type="button" onClick={onClose}>취소</button>
          <button type="button" onClick={onConfirm}>삭제</button>
        </div>
      </div>
    );
  }
expected:
  outcomes: [improved]
  findings:
    - description: 모달 컨테이너에 role="dialog", aria-modal, 제목을 가리키는 aria-labelledby가 없어 보조기술이 대화상자임을 알 수 없다.
      status: suspected
      fix_scope: local
      wcag_criteria: ["4.1.2"]
    - description: 열릴 때 포커스를 대화상자 안으로 옮기고 닫을 때 되돌리는 처리, Escape로 닫는 처리가 없다.
      status: suspected
      fix_scope: structural
      wcag_criteria: ["2.4.3", "2.1.2"]
  document_ids: [wcag-4.1.2, apg-dialog-roles, apg-dialog-keyboard]
