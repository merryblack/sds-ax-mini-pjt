id: dialog-03-image-close
component: dialog
category: issue
code_type: jsx
request: 이미지 미리보기 창 검토 부탁해.
code: |
  export function ImagePreview({ src, onClose }) {
    return (
      <div role="dialog" aria-modal="true" aria-label="이미지 미리보기">
        <img src="/icons/close.png" className="close" onClick={onClose} />
        <img src={src} alt="미리보기" />
      </div>
    );
  }
expected:
  outcomes: [improved]
  static_rule_ids:
    - jsx-a11y/alt-text
    - jsx-a11y/click-events-have-key-events
    - jsx-a11y/no-noninteractive-element-interactions
  findings:
    - description: 닫기 동작이 img의 onClick에만 있어 키보드로 대화상자를 닫을 수 없다. 버튼으로 바꿔야 한다.
      status: confirmed
      wcag_criteria: ["2.1.1"]
      rule_ids:
        - jsx-a11y/click-events-have-key-events
        - jsx-a11y/no-noninteractive-element-interactions
    - description: 닫기 이미지에 대체 텍스트가 없어 무슨 동작인지 알 수 없다.
      status: confirmed
      wcag_criteria: ["1.1.1"]
      rule_ids: [jsx-a11y/alt-text]
  document_ids: [wcag-2.1.1, wcag-1.1.1, apg-dialog-keyboard]
