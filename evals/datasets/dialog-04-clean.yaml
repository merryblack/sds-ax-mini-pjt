id: dialog-04-clean
component: dialog
category: negative
kind: clean
code_type: tsx
request: 이 대화상자 구현에 접근성 문제가 있는지 확인해 줘.
code: |
  import { useEffect, useRef } from "react";

  type Props = { open: boolean; onClose: () => void; onConfirm: () => void };

  export function ConfirmDialog({ open, onClose, onConfirm }: Props) {
    const dialogRef = useRef<HTMLDivElement>(null);
    const cancelRef = useRef<HTMLButtonElement>(null);

    useEffect(() => {
      if (!open) return;
      const previous = document.activeElement as HTMLElement | null;
      cancelRef.current?.focus();
      const onKey = (e: KeyboardEvent) => {
        if (e.key === "Escape") {
          onClose();
          return;
        }
        if (e.key !== "Tab" || !dialogRef.current) return;
        // Focus trap: keep Tab / Shift+Tab inside the dialog.
        const focusable = dialogRef.current.querySelectorAll<HTMLElement>("button, [href], input, select, textarea");
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      };
      document.addEventListener("keydown", onKey);
      return () => {
        document.removeEventListener("keydown", onKey);
        previous?.focus();
      };
    }, [open, onClose]);

    if (!open) return null;
    return (
      <div ref={dialogRef} role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-desc">
        <h2 id="confirm-title">삭제 확인</h2>
        <p id="confirm-desc">이 항목을 삭제하면 되돌릴 수 없습니다.</p>
        <button ref={cancelRef} type="button" onClick={onClose}>취소</button>
        <button type="button" onClick={onConfirm}>삭제</button>
      </div>
    );
  }
expected:
  outcomes: [no_issue_detected, no_change_needed]
